<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Instagram Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="6.css">
</head>
<body>

<div class="login-card">
  <h1 class="logo">Instagram</h1>

  <form>
    <input type="text" placeholder="Номер телефону, ім'я користувача або е...">
    <input type="password" placeholder="Пароль">
    <button type="submit" class="login-btn">Увійти</button>
  </form>

  <div class="separator">
    <span>АБО</span>
  </div>

  <a href="#" class="facebook-login">
    <i class="fa-brands fa-square-facebook"></i> Увійти через Facebook
  </a>

  <a href="#" class="forgot-pass">Забули пароль?</a>
</div>

<div class="reg-card">
  <p>Не маєте облікового запису? <a href="#" class="reg">Зареєструйтеся</a></p>
</div>

</body>
</html>
